<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="t">
  <title id="t">Neo4j Enterprise Edition on AWS: Private topology</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #374151; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #374151; }
    .note { font-size: 12px; fill: #374151; }
    .lbl { font-size: 11px; fill: #1f2937; }
    .vpc { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
    .az { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .pub { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
    .priv { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .node { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
    .nlb { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.5; }
    .bastion { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .ep { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .svc { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .ext { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
    .opt { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .igw { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .flow { fill: none; stroke: #1f2937; stroke-width: 1.6; }
    .flowd { fill: none; stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .halo { fill: #ffffff; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="36" class="title" text-anchor="middle">Neo4j Enterprise Edition on AWS: Private topology</text>
  <text x="700" y="60" class="subtitle" text-anchor="middle">New VPC 10.0.0.0/16 with three Availability Zones for a cluster and one for a single node. Nodes have no public IP and no internet route unless EnableInternetEgress=true.</text>
  <rect x="230" y="85" width="900" height="680" rx="8" class="vpc"/>
  <text x="240" y="102" class="h">VPC 10.0.0.0/16, created by the template</text>
  <rect x="262" y="112" width="840" height="56" rx="6" class="nlb"/>
  <text x="682.0" y="136.0" class="h" text-anchor="middle">Internal Network Load Balancer, scheme internal, cross-zone, one ENI in each private subnet</text>
  <text x="682.0" y="152.0" class="b" text-anchor="middle">TLS listeners 7473 HTTPS Browser and 7687 Bolt with the ACM certificate, TCP health checks, access logs to S3</text>
  <rect x="262" y="190" width="268" height="510" rx="8" class="az"/>
  <text x="272" y="207" class="h">Availability Zone a</text>
  <rect x="272" y="215" width="248" height="322" rx="8" class="priv"/>
  <text x="282" y="232" class="h">Private subnet 10.0.10.0/24</text>
  <text x="282" y="247" class="s">no public IPs</text>
  <rect x="282" y="250" width="228" height="72" rx="6" class="node"/>
  <text x="396.0" y="274.0" class="h" text-anchor="middle">Neo4j node 1</text>
  <text x="396.0" y="290.0" class="b" text-anchor="middle">ASG, MinSize = MaxSize = 1</text>
  <text x="396.0" y="306.0" class="b" text-anchor="middle">gp3 data volume, DeletionPolicy Retain</text>
  <rect x="282" y="344" width="228" height="54" rx="6" class="ep"/>
  <text x="396.0" y="367.0" class="h" text-anchor="middle">VPC interface endpoint ENIs</text>
  <text x="396.0" y="383.0" class="s" text-anchor="middle">nine services, 443 from nodes, bastion</text>
  <rect x="282" y="420" width="228" height="86" rx="6" class="bastion"/>
  <text x="396.0" y="443.0" class="h" text-anchor="middle">Operator bastion, t4g.small</text>
  <text x="396.0" y="459.0" class="b" text-anchor="middle">SSM entry point, no ingress</text>
  <text x="396.0" y="475.0" class="b" text-anchor="middle">port-forward to NLB 7473, 7687</text>
  <text x="396.0" y="491.0" class="b" text-anchor="middle">not an NLB target</text>
  <rect x="272" y="553" width="248" height="120" rx="8" class="pub"/>
  <text x="282" y="570" class="h">Public subnet 10.0.1.0/24</text>
  <text x="282" y="585" class="s">carries only the optional NAT gateway</text>
  <rect x="282" y="598" width="228" height="64" rx="6" class="opt"/>
  <text x="396.0" y="618.0" class="h" text-anchor="middle">NAT GW, optional</text>
  <text x="396.0" y="634.0" class="b" text-anchor="middle">EnableInternetEgress=true</text>
  <text x="396.0" y="650.0" class="s" text-anchor="middle">with its own Elastic IP</text>
  <path d="M 396.0 168 L 396.0 250" class="flow" marker-end="url(#ah)"/>
  <rect x="400" y="173" width="70" height="15" class="halo"/>
  <text x="404.0" y="183" class="lbl">7473, 7687</text>
  <path d="M 336.0 322 L 336.0 344" class="flow" marker-end="url(#ah)"/>
  <rect x="304" y="328" width="26" height="15" class="halo"/>
  <text x="330.0" y="338" class="lbl" text-anchor="end">443</text>
  <path d="M 476.0 537 L 476.0 598" class="flowd" marker-end="url(#ahd)"/>
  <rect x="480" y="582" width="63" height="15" class="halo"/>
  <text x="484.0" y="592" class="lbl">0.0.0.0/0</text>
  <path d="M 396.0 662 L 396.0 718" class="flowd" marker-end="url(#ahd)"/>
  <rect x="548" y="190" width="268" height="510" rx="8" class="az"/>
  <text x="558" y="207" class="h">Availability Zone b</text>
  <text x="708" y="207" class="s">cluster only</text>
  <rect x="558" y="215" width="248" height="322" rx="8" class="priv"/>
  <text x="568" y="232" class="h">Private subnet 10.0.11.0/24</text>
  <text x="568" y="247" class="s">no public IPs</text>
  <rect x="568" y="250" width="228" height="72" rx="6" class="node"/>
  <text x="682.0" y="274.0" class="h" text-anchor="middle">Neo4j node 2</text>
  <text x="682.0" y="290.0" class="b" text-anchor="middle">ASG, MinSize = MaxSize = 1</text>
  <text x="682.0" y="306.0" class="b" text-anchor="middle">gp3 data volume, DeletionPolicy Retain</text>
  <rect x="568" y="344" width="228" height="54" rx="6" class="ep"/>
  <text x="682.0" y="367.0" class="h" text-anchor="middle">VPC interface endpoint ENIs</text>
  <text x="682.0" y="383.0" class="s" text-anchor="middle">nine services, 443 from nodes, bastion</text>
  <text x="682.0" y="470" class="s" text-anchor="middle">no bastion in this zone</text>
  <rect x="558" y="553" width="248" height="120" rx="8" class="pub"/>
  <text x="568" y="570" class="h">Public subnet 10.0.2.0/24</text>
  <text x="568" y="585" class="s">carries only the optional NAT gateway</text>
  <rect x="568" y="598" width="228" height="64" rx="6" class="opt"/>
  <text x="682.0" y="618.0" class="h" text-anchor="middle">NAT GW, optional</text>
  <text x="682.0" y="634.0" class="b" text-anchor="middle">EnableInternetEgress=true</text>
  <text x="682.0" y="650.0" class="s" text-anchor="middle">with its own Elastic IP</text>
  <path d="M 682.0 168 L 682.0 250" class="flow" marker-end="url(#ah)"/>
  <rect x="686" y="173" width="70" height="15" class="halo"/>
  <text x="690.0" y="183" class="lbl">7473, 7687</text>
  <path d="M 622.0 322 L 622.0 344" class="flow" marker-end="url(#ah)"/>
  <rect x="590" y="328" width="26" height="15" class="halo"/>
  <text x="616.0" y="338" class="lbl" text-anchor="end">443</text>
  <path d="M 762.0 537 L 762.0 598" class="flowd" marker-end="url(#ahd)"/>
  <rect x="766" y="582" width="63" height="15" class="halo"/>
  <text x="770.0" y="592" class="lbl">0.0.0.0/0</text>
  <path d="M 682.0 662 L 682.0 718" class="flowd" marker-end="url(#ahd)"/>
  <rect x="834" y="190" width="268" height="510" rx="8" class="az"/>
  <text x="844" y="207" class="h">Availability Zone c</text>
  <text x="994" y="207" class="s">cluster only</text>
  <rect x="844" y="215" width="248" height="322" rx="8" class="priv"/>
  <text x="854" y="232" class="h">Private subnet 10.0.12.0/24</text>
  <text x="854" y="247" class="s">no public IPs</text>
  <rect x="854" y="250" width="228" height="72" rx="6" class="node"/>
  <text x="968.0" y="274.0" class="h" text-anchor="middle">Neo4j node 3</text>
  <text x="968.0" y="290.0" class="b" text-anchor="middle">ASG, MinSize = MaxSize = 1</text>
  <text x="968.0" y="306.0" class="b" text-anchor="middle">gp3 data volume, DeletionPolicy Retain</text>
  <rect x="854" y="344" width="228" height="54" rx="6" class="ep"/>
  <text x="968.0" y="367.0" class="h" text-anchor="middle">VPC interface endpoint ENIs</text>
  <text x="968.0" y="383.0" class="s" text-anchor="middle">nine services, 443 from nodes, bastion</text>
  <text x="968.0" y="470" class="s" text-anchor="middle">no bastion in this zone</text>
  <rect x="844" y="553" width="248" height="120" rx="8" class="pub"/>
  <text x="854" y="570" class="h">Public subnet 10.0.3.0/24</text>
  <text x="854" y="585" class="s">carries only the optional NAT gateway</text>
  <rect x="854" y="598" width="228" height="64" rx="6" class="opt"/>
  <text x="968.0" y="618.0" class="h" text-anchor="middle">NAT GW, optional</text>
  <text x="968.0" y="634.0" class="b" text-anchor="middle">EnableInternetEgress=true</text>
  <text x="968.0" y="650.0" class="s" text-anchor="middle">with its own Elastic IP</text>
  <path d="M 968.0 168 L 968.0 250" class="flow" marker-end="url(#ah)"/>
  <rect x="972" y="173" width="70" height="15" class="halo"/>
  <text x="976.0" y="183" class="lbl">7473, 7687</text>
  <path d="M 908.0 322 L 908.0 344" class="flow" marker-end="url(#ah)"/>
  <rect x="876" y="328" width="26" height="15" class="halo"/>
  <text x="902.0" y="338" class="lbl" text-anchor="end">443</text>
  <path d="M 1048.0 537 L 1048.0 598" class="flowd" marker-end="url(#ahd)"/>
  <rect x="1052" y="582" width="63" height="15" class="halo"/>
  <text x="1056.0" y="592" class="lbl">0.0.0.0/0</text>
  <path d="M 968.0 662 L 968.0 718" class="flowd" marker-end="url(#ahd)"/>
  <path d="M 322 420 L 322 398" class="flow" marker-end="url(#ah)"/>
  <rect x="324" y="404" width="88" height="15" class="halo"/>
  <text x="328" y="414" class="lbl">443 SSM agent</text>
  <path d="M 282 480 L 246 480 L 246 156 L 262 156" class="flow" marker-end="url(#ah)"/>
  <path d="M 510 300 L 568 300" class="flow" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="523" y="286" width="33" height="15" class="halo"/>
  <text x="539.0" y="296" class="lbl" text-anchor="middle">Raft</text>
  <path d="M 796 300 L 854 300" class="flow" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="809" y="286" width="33" height="15" class="halo"/>
  <text x="825.0" y="296" class="lbl" text-anchor="middle">Raft</text>
  <rect x="262" y="718" width="840" height="34" rx="6" class="igw"/>
  <text x="682.0" y="739.0" class="h" text-anchor="middle">Internet Gateway, always attached, 0.0.0.0/0 route for the public subnets</text>
  <rect x="12" y="112" width="200" height="74" rx="6" class="ext"/>
  <text x="112.0" y="130.0" class="h" text-anchor="middle">Clients in this VPC</text>
  <text x="112.0" y="145.0" class="h" text-anchor="middle">or a peered VPC</text>
  <text x="112.0" y="160.0" class="s" text-anchor="middle">AllowedCIDR, default 10.0.0.0/16</text>
  <text x="112.0" y="175.0" class="s" text-anchor="middle">TLS to the NLB, 7473 and 7687</text>
  <path d="M 212 140 L 262 140" class="flow" marker-end="url(#ah)"/>
  <rect x="12" y="230" width="200" height="76" rx="6" class="opt"/>
  <text x="112.0" y="249.0" class="h" text-anchor="middle">Route 53 private hosted zone</text>
  <text x="112.0" y="264.0" class="s" text-anchor="middle">optional, CreatePrivateDns=true</text>
  <text x="112.0" y="279.0" class="s" text-anchor="middle">alias AdvertisedDNS to the NLB</text>
  <text x="112.0" y="294.0" class="s" text-anchor="middle">or a zone you pass in</text>
  <path d="M 212 250 L 262 164" class="flowd" marker-end="url(#ahd)"/>
  <rect x="12" y="700" width="200" height="65" rx="6" class="ext"/>
  <text x="112.0" y="721.0" class="h" text-anchor="middle">Internet</text>
  <text x="112.0" y="736.0" class="s" text-anchor="middle">OIDC issuer, OS packages</text>
  <text x="112.0" y="751.0" class="s" text-anchor="middle">reachable only through NAT</text>
  <path d="M 262 735 L 212 735" class="flowd" marker-end="url(#ahd)"/>
  <rect x="1148" y="112" width="240" height="90" rx="6" class="ext"/>
  <text x="1268.0" y="130.5" class="h" text-anchor="middle">Operator laptop</text>
  <text x="1268.0" y="145.5" class="s" text-anchor="middle">AWS credentials stay here; the driver</text>
  <text x="1268.0" y="160.5" class="s" text-anchor="middle">and cypher-shell run locally</text>
  <text x="1268.0" y="175.5" class="s" text-anchor="middle">SSM Session Manager port-forward</text>
  <text x="1268.0" y="190.5" class="s" text-anchor="middle">over 443, no SSH, no key pair</text>
  <rect x="1148" y="300" width="240" height="124" rx="6" class="svc"/>
  <text x="1268.0" y="326.0" class="h" text-anchor="middle">AWS APIs behind the endpoints</text>
  <text x="1268.0" y="342.0" class="b" text-anchor="middle">ssm, ssmmessages, ec2messages</text>
  <text x="1268.0" y="358.0" class="b" text-anchor="middle">logs, secretsmanager, ec2</text>
  <text x="1268.0" y="374.0" class="b" text-anchor="middle">cloudformation, autoscaling, acm</text>
  <text x="1268.0" y="390.0" class="s" text-anchor="middle">S3 via a gateway endpoint on the private</text>
  <text x="1268.0" y="406.0" class="s" text-anchor="middle">route tables, AWS and account buckets</text>
  <path d="M 1268.0 202 L 1268.0 300" class="flow" marker-end="url(#ah)"/>
  <rect x="1272" y="245" width="100" height="15" class="halo"/>
  <text x="1276.0" y="255" class="lbl">Session Manager</text>
  <path d="M 1082 371 L 1148 371" class="flow" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <rect x="1077" y="355" width="76" height="15" class="halo"/>
  <text x="1115.0" y="365" class="lbl" text-anchor="middle">PrivateLink</text>
  <rect x="1148" y="444" width="240" height="160" rx="6" class="svc"/>
  <text x="1268.0" y="464.0" class="h" text-anchor="middle">Stack resources outside the VPC</text>
  <text x="1268.0" y="480.0" class="s" text-anchor="middle">Secrets: admin and app passwords</text>
  <text x="1268.0" y="496.0" class="s" text-anchor="middle">KMS stack key, Retain</text>
  <text x="1268.0" y="512.0" class="s" text-anchor="middle">CloudWatch log groups: application,</text>
  <text x="1268.0" y="528.0" class="s" text-anchor="middle">VPC flow logs, SSM sessions</text>
  <text x="1268.0" y="544.0" class="s" text-anchor="middle">SNS alert topic, failed-auth alarm</text>
  <text x="1268.0" y="560.0" class="s" text-anchor="middle">S3 bucket for NLB access logs</text>
  <text x="1268.0" y="576.0" class="s" text-anchor="middle">SSM parameters /neo4j-ee/&lt;stack&gt;/</text>
  <text x="1268.0" y="592.0" class="s" text-anchor="middle">Node and bastion IAM roles</text>
  <rect x="1148" y="624" width="240" height="100" rx="6" class="svc"/>
  <text x="1268.0" y="640.0" class="h" text-anchor="middle">Node egress</text>
  <text x="1268.0" y="655.0" class="s" text-anchor="middle">443 to endpoint SG and region S3</text>
  <text x="1268.0" y="670.0" class="s" text-anchor="middle">cluster ports 5000, 6000, 7000, 7688</text>
  <text x="1268.0" y="685.0" class="s" text-anchor="middle">443 to any address only when</text>
  <text x="1268.0" y="700.0" class="s" text-anchor="middle">OidcIssuerUri is set, which also</text>
  <text x="1268.0" y="715.0" class="s" text-anchor="middle">requires EnableInternetEgress=true</text>
  <text x="20" y="790" class="note">Routing: each private subnet has its own route table with the S3 gateway endpoint. The 0.0.0.0/0 route to a NAT gateway exists only when EnableInternetEgress=true, the default is false. The public route table sends 0.0.0.0/0 to the Internet Gateway.</text>
  <text x="20" y="810" class="note">Security groups: NLB SG admits AllowedCIDR on 7473 and 7687. External SG admits only the NLB SG. Internal SG carries the cluster ports between nodes. Endpoint SG admits 443 from the nodes and the bastion. The bastion SG has no ingress.</text>
  <rect x="20" y="828" width="1360" height="56" rx="6" class="ext"/>
  <text x="32" y="848" class="h">Legend</text>
  <rect x="100" y="837" width="26" height="14" rx="3" class="svc"/>
  <text x="134" y="848" class="b">Solid box: created by the template</text>
  <rect x="360" y="837" width="26" height="14" rx="3" class="opt"/>
  <text x="394" y="848" class="b">Dashed box: optional or caller-supplied</text>
  <path d="M 650 844 L 690 844" class="flow" marker-end="url(#ah)"/>
  <text x="700" y="848" class="b">Solid arrow: traffic path that always exists</text>
  <path d="M 995 844 L 1035 844" class="flowd" marker-end="url(#ahd)"/>
  <text x="1045" y="848" class="b">Dashed arrow: optional or caller-supplied path</text>
</svg>
