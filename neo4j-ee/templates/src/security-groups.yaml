  Neo4jNLBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow client traffic to Neo4j NLB on ports 7473 and 7687
      VpcId: !Ref Neo4jVPC
      # An explicit egress rule replaces the default allow-all rule. An empty
      # list does not, so the loopback placeholder below stands in for "no
      # egress". No real traffic matches it.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: Placeholder that removes the default allow-all egress rule
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7473
          ToPort: 7473
          CidrIp: !Ref AllowedCIDR
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          CidrIp: !Ref AllowedCIDR

  Neo4jExternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Neo4j traffic from NLB to instances on ports 7473 and 7687
      VpcId: !Ref Neo4jVPC
      # Node egress is HTTPS to the VPC interface endpoints only (security
      # review H2). Both node SGs carry it inline, because an SG without an
      # inline egress rule keeps the default allow-all rule and the instance
      # gets the union of its SGs.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !GetAtt VpcEndpointSecurityGroup.GroupId
          Description: HTTPS to the VPC interface endpoints
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7473
          ToPort: 7473
          SourceSecurityGroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          SourceSecurityGroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId

  Neo4jNLBEgressToBrowser:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7473
      ToPort: 7473
      DestinationSecurityGroupId: !GetAtt Neo4jExternalSecurityGroup.GroupId

  Neo4jNLBEgressToBolt:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7687
      ToPort: 7687
      DestinationSecurityGroupId: !GetAtt Neo4jExternalSecurityGroup.GroupId

  Neo4jInternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable Neo4j Internal Ports
      VpcId: !Ref Neo4jVPC
      # Node egress is HTTPS to the VPC interface endpoints only (security
      # review H2). Both node SGs carry it inline, because an SG without an
      # inline egress rule keeps the default allow-all rule and the instance
      # gets the union of its SGs.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !GetAtt VpcEndpointSecurityGroup.GroupId
          Description: HTTPS to the VPC interface endpoints

  Neo4jInternalSGIngress5000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGIngress6000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 6000
      ToPort: 6000
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGIngress7000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7000
      ToPort: 7000
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGIngress7688:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7688
      ToPort: 7688
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGEgress5000:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  Neo4jInternalSGEgress6000:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 6000
      ToPort: 6000
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  Neo4jInternalSGEgress7000:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7000
      ToPort: 7000
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  Neo4jInternalSGEgress7688:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7688
      ToPort: 7688
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  # The OIDC issuer is outside the VPC and has no endpoint. Neo4j fetches its
  # discovery document and signing keys over HTTPS, so this is the one node
  # egress rule to the internet. It exists only when OIDC is configured.
  Neo4jInternalSGEgressOidc:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: OidcEnabled
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS to the OIDC identity provider

  # Same-region S3 through its AWS-managed prefix list. SSM Agent updates,
  # patch baselines and Hume seeding read S3 objects. The prefix list holds
  # only same-region S3 addresses, so a cross-region S3 URL still fails.
  Neo4jInternalSGEgressS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !GetAtt S3PrefixList.PrefixListId
      Description: HTTPS to same-region S3

  # ---------------------------------------------------------------------------
  # Operator bastion (Private mode only)
  # A non-Neo4j-target t4g.small used as the SSM Session Manager entry point
  # for operator port-forwarding to the internal NLB. It is deliberately NOT
  # registered in any NLB target group — that topology makes NAT-loopback
  # (hairpin) failures impossible for flows originating from the bastion, so
  # operator tunnels to :7473/:7687 via the NLB always route to a different
  # instance than the flow source. See README "Private mode networking" and
  # neo4j-ee/worklog/FIX_SSM_V7.md §9 for the full analysis.
  # ---------------------------------------------------------------------------

  Neo4jBastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Operator bastion - no ingress; outbound via VPC endpoints and NLB
      VpcId: !Ref Neo4jVPC
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Sub '${AWS::StackName}-bastion-sg'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  # ---------------------------------------------------------------------------
  # VPC interface endpoints (Private mode)
  # Node egress reaches AWS only through these endpoints (security review H2).
  # The nine services are every AWS API the node boot path and the SSM agent
  # call: ssm, ssmmessages, ec2messages, logs, secretsmanager, ec2,
  # cloudformation, autoscaling and acm. The endpoints are in
  # networking-private.yaml.
  # ---------------------------------------------------------------------------

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from Neo4j instances and operator bastion to VPC interface endpoints
      VpcId: !Ref Neo4jVPC
      # Ingress is declared as separate resources so the node SGs can name
      # this SG as their egress target without a dependency cycle.
      # An explicit egress rule replaces the default allow-all rule. An empty
      # list does not, so the loopback placeholder below stands in for "no
      # egress". No real traffic matches it.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: Placeholder that removes the default allow-all egress rule

  VpcEndpointSGIngressFromNodes:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt VpcEndpointSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: HTTPS from the Neo4j nodes

  VpcEndpointSGIngressFromBastion:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt VpcEndpointSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !GetAtt Neo4jBastionSecurityGroup.GroupId
      Description: HTTPS from the operator bastion
