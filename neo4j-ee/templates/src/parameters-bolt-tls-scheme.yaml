  BoltTlsScheme:
    Description: >-
      Bolt URL scheme published in /neo4j-ee/<stack>/bolt-url and the
      Neo4jBoltUrl output. The default neo4j+s verifies the certificate.
      Choose neo4j+ssc only for a self-signed test certificate. Scoped to
      Private and ExistingVpc; the Public template derives its scheme from
      UsePublicTLS instead.
    Type: String
    AllowedValues: ['neo4j+s', 'neo4j+ssc']
    Default: 'neo4j+s'
