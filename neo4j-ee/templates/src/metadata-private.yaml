  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "AWS Marketplace Parameters"
        Parameters:
          - ImageId
      - Label:
          default: "Neo4j Configuration"
        Parameters:
          - Password
          - NumberOfServers
          - InstanceType
          - DataDiskSize
          - DataVolumeKmsKeyId
          - Node1SnapshotId
      - Label:
          default: "Plugin licensing (Bloom, GDS)"
        Parameters:
          - InstallBloom
          - BloomLicenseSecretArn
          - InstallGDS
          - GdsLicenseSecretArn
      - Label:
          default: "Network"
        Parameters:
          - AvailabilityZones
          - NlbDeletionProtection
          - EnableInternetEgress
      - Label:
          default: "TLS"
        Parameters:
          - CertificateArn
          - AdvertisedDNS
          - BoltTlsScheme
      - Label:
          default: "Private DNS"
        Parameters:
          - CreatePrivateDns
          - PrivateDnsZoneName
          - PrivateDnsHostedZoneId
      - Label:
          default: "Security & Monitoring"
        Parameters:
          - AllowedCIDR
          - AlertEmail
      - Label:
          default: "Single sign-on (OIDC)"
        Parameters:
          - OidcIssuerUri
          - OidcClientId
          - OidcBrowserClientId
          - OidcPrincipalClaim
          - OidcGroupsClaim
          - OidcAdminGroup
          - OidcReaderGroup
    ParameterLabels:
      ImageId:
        default: Image ID
      Password:
        default: Password
      NumberOfServers:
        default: Number of Servers
      InstanceType:
        default: Instance Type
      DataDiskSize:
        default: Data Disk Size (GB)
      DataVolumeKmsKeyId:
        default: Data Volume KMS Key ID
      InstallBloom:
        default: Install Bloom Plugin
      BloomLicenseSecretArn:
        default: Bloom License Secret ARN
      InstallGDS:
        default: Install Graph Data Science Plugin
      GdsLicenseSecretArn:
        default: GDS License Secret ARN
      AlertEmail:
        default: Alert Email Address
      AllowedCIDR:
        default: Allowed CIDR
      CertificateArn:
        default: ACM Certificate ARN
      AdvertisedDNS:
        default: Advertised DNS Name
      CreatePrivateDns:
        default: Create Private DNS
      PrivateDnsZoneName:
        default: Private DNS Zone Name
      PrivateDnsHostedZoneId:
        default: Private DNS Hosted Zone ID
      OidcIssuerUri:
        default: OIDC Issuer URI
      OidcClientId:
        default: OIDC Client ID (Audience)
      OidcBrowserClientId:
        default: OIDC Browser Client ID
      OidcPrincipalClaim:
        default: OIDC Username Claim
      OidcGroupsClaim:
        default: OIDC Groups Claim
      OidcAdminGroup:
        default: OIDC Admin Group
      OidcReaderGroup:
        default: OIDC Reader Group
      Node1SnapshotId:
        default: Node 1 Snapshot ID
      BoltTlsScheme:
        default: Bolt TLS Scheme
      AvailabilityZones:
        default: Availability Zones
      NlbDeletionProtection:
        default: NLB Deletion Protection
      EnableInternetEgress:
        default: Enable Internet Egress
