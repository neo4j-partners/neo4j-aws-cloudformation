  Neo4jOperatorBastion:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: t4g.small
      SubnetId: !Ref PrivateSubnet1Id
      SecurityGroupIds:
        - !Ref Neo4jBastionSecurityGroup
      IamInstanceProfile: !Ref Neo4jBastionInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

          dnf install -y python3.11 python3.11-pip
          dnf update -y aws-cfn-bootstrap
          python3.11 -m pip install 'neo4j>=6,<7' boto3

          # Neo4j yum repo + cypher-shell for interactive admin via:
          #   aws ssm start-session --target <bastion> → cypher-shell -a neo4j://<nlb>:7687
          rpm --import https://debian.neo4j.com/neotechnology.gpg.key
          printf '[neo4j]\nname=Neo4j RPM Repository\nbaseurl=https://yum.neo4j.com/stable/latest\nenabled=1\ngpgcheck=1\n' >/etc/yum.repos.d/neo4j.repo
          dnf install -y cypher-shell

          systemctl is-active amazon-ssm-agent

          /opt/aws/bin/cfn-signal --success true \
            --stack ${AWS::StackName} \
            --resource Neo4jOperatorBastion \
            --region ${AWS::Region}
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Sub '${AWS::StackName}-bastion'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcId: !Ref VpcId
      SubnetIds: !If
        - CreateCluster
        - - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
          - !Ref PrivateSubnet3Id
        - - !Ref PrivateSubnet1Id
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  SsmMessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcId: !Ref VpcId
      SubnetIds: !If
        - CreateCluster
        - - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
          - !Ref PrivateSubnet3Id
        - - !Ref PrivateSubnet1Id
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  LogsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcId: !Ref VpcId
      SubnetIds: !If
        - CreateCluster
        - - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
          - !Ref PrivateSubnet3Id
        - - !Ref PrivateSubnet1Id
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !Ref VpcId
      SubnetIds: !If
        - CreateCluster
        - - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
          - !Ref PrivateSubnet3Id
        - - !Ref PrivateSubnet1Id
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  Neo4jNetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # PrivateSubnet2Id/3Id are optional String params (Default '') used only by
    # the CreateCluster branch of Subnets below. cfn-lint resolves the empty
    # default into a subnet-typed slot and emits W1030 even though the single
    # node branch never references them and the ClusterSubnetsRequired Rule
    # guarantees real subnet IDs whenever NumberOfServers != 1. Scope the
    # suppression to this resource.
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      IpAddressType: ipv4
      Name: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'nlb'
      Scheme: internal
      SecurityGroups:
        - !Ref Neo4jNLBSecurityGroup
      Subnets: !If
        - CreateCluster
        - - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
          - !Ref PrivateSubnet3Id
        - - !Ref PrivateSubnet1Id
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: "true"
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      Type: network

  Neo4jBrowserListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref Neo4jBrowserTargetGroup
          Type: forward
      LoadBalancerArn: !Ref Neo4jNetworkLoadBalancer
      Port: 7473
      Protocol: TLS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09

  Neo4jBoltListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref Neo4jBoltTargetGroup
          Type: forward
      LoadBalancerArn: !Ref Neo4jNetworkLoadBalancer
      Port: 7687
      Protocol: TLS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09

  Neo4jPrivateDnsHostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreatePrivateDnsHostedZone
    Properties:
      Name: !Ref PrivateDnsZoneName
      HostedZoneConfig:
        Comment: !Sub 'Private DNS for Neo4j stack ${AWS::StackName}'
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref 'AWS::Region'
      HostedZoneTags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jAdvertisedDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreatePrivateDns
    Properties:
      HostedZoneId: !If
        - UseExistingPrivateDnsHostedZone
        - !Ref PrivateDnsHostedZoneId
        - !Ref Neo4jPrivateDnsHostedZone
      Name: !Ref AdvertisedDNS
      Type: A
      AliasTarget:
        DNSName: !GetAtt Neo4jNetworkLoadBalancer.DNSName
        HostedZoneId: !GetAtt Neo4jNetworkLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  Neo4jBrowserTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'https'
          - 'tg'
      Port: 7473
      Protocol: TLS
      # TCP health check (not HTTPS): the NLB health checker opens the TLS
      # connection without an SNI server name, and Neo4j's Jetty enforces
      # sniHostCheck (the cert SAN must be AdvertisedDNS), so an HTTPS GET /
      # health probe is answered 400 Invalid SNI and the target never goes
      # healthy. With HealthCheckType=ELB on the node ASGs that turns into a
      # permanent ~grace-period self-heal kill loop. A TCP connect is the
      # strongest check NLB can run here without SNI; the L7 "Neo4j actually
      # serving" assurance is covered by the validate-private conf/TLS audit.
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      # preserve_client_ip.enabled=false prevents NLB NAT-loopback (hairpin)
      # failures when operator tunnels reach the NLB from a cluster member.
      # See README "Private mode networking" and worklog/FIX_SSM_V7.md §9.
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: "false"
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref VpcId

  Neo4jBoltTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'bolt'
          - 'tg'
      Port: 7687
      Protocol: TLS
      # Bolt is a binary protocol, not HTTP, so no L7 health check exists; a
      # TCP connect is the strongest check NLB can run for this target group.
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: "false"
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref VpcId
