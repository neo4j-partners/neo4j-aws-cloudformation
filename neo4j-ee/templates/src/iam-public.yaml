  Neo4jInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: Neo4jRole
  Neo4jRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: Neo4jPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Describe-only actions: AWS does not support resource-level
              # conditions on EC2/ASG Describe calls, so Resource: "*" is
              # required. autoscaling:DescribeAutoScalingGroups is used by
              # the tag-filtered peer discovery in UserData.
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeTags
                Resource: "*"
              # cfn-init reads this stack's metadata and cfn-signal signals
              # this stack's resources. Neither needs any other stack.
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStack*
                  - cloudformation:SignalResource
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              # Two-statement form: volume-side enforces StackID+Role,
              # instance-side enforces StackID. Both conditions must be
              # satisfied for an attach to succeed.
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/StackID': !Ref 'AWS::StackId'
                    'aws:ResourceTag/Role': neo4j-cluster-data
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/StackID': !Ref 'AWS::StackId'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/neo4j/${AWS::StackName}/application:*'
              - !If
                - BloomEnabledAndLicensed
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !Ref BloomLicenseSecretArn
                - !Ref AWS::NoValue
              - !If
                - GdsEnabledAndLicensed
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !Ref GdsLicenseSecretArn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref Neo4jPasswordSecret
                  - !Ref Neo4jAppPasswordSecret
              # The password secrets use the stack key. The key policy allows
              # data-plane use only through Secrets Manager.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt Neo4jStackKey.Arn
