  Neo4jVPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsHostnames: true
      EnableDnsSupport: true
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  # ---------------------------------------------------------------------------
  # Public subnets — carry NAT Gateways only; instances live in private subnets
  # ---------------------------------------------------------------------------

  Neo4jSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !If
        - HasAvailabilityZones
        - !Select [0, !Ref AvailabilityZones]
        - !Select [0, !GetAZs '']
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateCluster
    Properties:
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !If
        - HasAvailabilityZones
        - !Select [1, !Ref AvailabilityZones]
        - !Select [1, !GetAZs '']
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jSubnet3:
    Type: AWS::EC2::Subnet
    Condition: CreateCluster
    Properties:
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !If
        - HasAvailabilityZones
        - !Select [2, !Ref AvailabilityZones]
        - !Select [2, !GetAZs '']
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  # ---------------------------------------------------------------------------
  # Private subnets — instances and NLB
  # ---------------------------------------------------------------------------

  Neo4jPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.10.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !If
        - HasAvailabilityZones
        - !Select [0, !Ref AvailabilityZones]
        - !Select [0, !GetAZs '']
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateCluster
    Properties:
      CidrBlock: 10.0.11.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !If
        - HasAvailabilityZones
        - !Select [1, !Ref AvailabilityZones]
        - !Select [1, !GetAZs '']
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jPrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: CreateCluster
    Properties:
      CidrBlock: 10.0.12.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !If
        - HasAvailabilityZones
        - !Select [2, !Ref AvailabilityZones]
        - !Select [2, !GetAZs '']
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  # ---------------------------------------------------------------------------
  # NAT Gateways. The nodes reach every AWS API through VPC endpoints. The
  # NAT gateways, their EIPs and the private default routes exist only when
  # EnableInternetEgress is true. OIDC sign-in and a Hume stack in this VPC
  # need that egress. There is one per AZ in 3-node mode and one in 1-node
  # mode.
  # ---------------------------------------------------------------------------

  Neo4jNatEIP1:
    Type: AWS::EC2::EIP
    Condition: InternetEgressEnabled
    Properties:
      Domain: vpc
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jNatEIP2:
    Type: AWS::EC2::EIP
    Condition: InternetEgressEnabledAndCluster
    Properties:
      Domain: vpc
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jNatEIP3:
    Type: AWS::EC2::EIP
    Condition: InternetEgressEnabledAndCluster
    Properties:
      Domain: vpc
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jNatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: InternetEgressEnabled
    DependsOn: Neo4jInternetGatewayAttachment
    Properties:
      AllocationId: !GetAtt Neo4jNatEIP1.AllocationId
      SubnetId: !Ref Neo4jSubnet1
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jNatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: InternetEgressEnabledAndCluster
    DependsOn: Neo4jInternetGatewayAttachment
    Properties:
      AllocationId: !GetAtt Neo4jNatEIP2.AllocationId
      SubnetId: !Ref Neo4jSubnet2
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jNatGateway3:
    Type: AWS::EC2::NatGateway
    Condition: InternetEgressEnabledAndCluster
    DependsOn: Neo4jInternetGatewayAttachment
    Properties:
      AllocationId: !GetAtt Neo4jNatEIP3.AllocationId
      SubnetId: !Ref Neo4jSubnet3
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  # ---------------------------------------------------------------------------
  # Private route tables, one per AZ. Tables 2 and 3 exist only in 3-node
  # mode. The tables and their subnet associations are unconditional. Only
  # the default route to the NAT gateway depends on EnableInternetEgress.
  # ---------------------------------------------------------------------------

  Neo4jPrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Neo4jVPC
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jPrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: CreateCluster
    Properties:
      VpcId: !Ref Neo4jVPC
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jPrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Condition: CreateCluster
    Properties:
      VpcId: !Ref Neo4jVPC
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jPrivateRoute1:
    Type: AWS::EC2::Route
    Condition: InternetEgressEnabled
    Properties:
      RouteTableId: !Ref Neo4jPrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Neo4jNatGateway1

  Neo4jPrivateRoute2:
    Type: AWS::EC2::Route
    Condition: InternetEgressEnabledAndCluster
    Properties:
      RouteTableId: !Ref Neo4jPrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Neo4jNatGateway2

  Neo4jPrivateRoute3:
    Type: AWS::EC2::Route
    Condition: InternetEgressEnabledAndCluster
    Properties:
      RouteTableId: !Ref Neo4jPrivateRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref Neo4jNatGateway3

  Neo4jPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Neo4jPrivateRouteTable1
      SubnetId: !Ref Neo4jPrivateSubnet1

  Neo4jPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateCluster
    Properties:
      RouteTableId: !Ref Neo4jPrivateRouteTable2
      SubnetId: !Ref Neo4jPrivateSubnet2

  Neo4jPrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateCluster
    Properties:
      RouteTableId: !Ref Neo4jPrivateRouteTable3
      SubnetId: !Ref Neo4jPrivateSubnet3

  # ---------------------------------------------------------------------------
  # Public route table and Internet Gateway
  # ---------------------------------------------------------------------------

  Neo4jRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jRoute:
    Type: AWS::EC2::Route
    DependsOn: Neo4jInternetGatewayAttachment
    Properties:
      GatewayId: !Ref Neo4jInternetGateway
      RouteTableId: !Ref Neo4jRouteTable
      DestinationCidrBlock: 0.0.0.0/0

  Neo4jSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Neo4jRouteTable
      SubnetId: !Ref Neo4jSubnet1

  Neo4jSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateCluster
    Properties:
      RouteTableId: !Ref Neo4jRouteTable
      SubnetId: !Ref Neo4jSubnet2

  Neo4jSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateCluster
    Properties:
      RouteTableId: !Ref Neo4jRouteTable
      SubnetId: !Ref Neo4jSubnet3

  Neo4jInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref Neo4jInternetGateway
      VpcId: !Ref Neo4jVPC

  # ---------------------------------------------------------------------------
  # Network Load Balancer — always internal in the private template
  # ---------------------------------------------------------------------------

  Neo4jNetworkLoadBalancer:
    DependsOn:
      - Neo4jInternetGatewayAttachment
      - Neo4jNlbAccessLogsBucketPolicy
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'nlb'
      Scheme: internal
      SecurityGroups:
        - !Ref Neo4jNLBSecurityGroup
      Subnets: !If
        - CreateCluster
        - - !Ref Neo4jPrivateSubnet1
          - !Ref Neo4jPrivateSubnet2
          - !Ref Neo4jPrivateSubnet3
        - - !Ref Neo4jPrivateSubnet1
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: !Ref NlbDeletionProtection
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref Neo4jNlbAccessLogsBucket
        - Key: access_logs.s3.prefix
          Value: nlb
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      Type: network

  Neo4jBrowserListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref Neo4jBrowserTargetGroup
          Type: forward
      LoadBalancerArn: !Ref Neo4jNetworkLoadBalancer
      Port: 7473
      Protocol: TLS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09

  Neo4jBoltListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref Neo4jBoltTargetGroup
          Type: forward
      LoadBalancerArn: !Ref Neo4jNetworkLoadBalancer
      Port: 7687
      Protocol: TLS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09

  Neo4jPrivateDnsHostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreatePrivateDnsHostedZone
    Properties:
      Name: !Ref PrivateDnsZoneName
      HostedZoneConfig:
        Comment: !Sub 'Private DNS for Neo4j stack ${AWS::StackName}'
      VPCs:
        - VPCId: !Ref Neo4jVPC
          VPCRegion: !Ref 'AWS::Region'
      HostedZoneTags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jAdvertisedDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreatePrivateDns
    Properties:
      HostedZoneId: !If
        - UseExistingPrivateDnsHostedZone
        - !Ref PrivateDnsHostedZoneId
        - !Ref Neo4jPrivateDnsHostedZone
      Name: !Ref AdvertisedDNS
      Type: A
      AliasTarget:
        DNSName: !GetAtt Neo4jNetworkLoadBalancer.DNSName
        HostedZoneId: !GetAtt Neo4jNetworkLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  Neo4jBrowserTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'https'
          - 'tg'
      Port: 7473
      Protocol: TLS
      # TCP health check (not HTTPS): the NLB health checker opens the TLS
      # connection without an SNI server name, and Neo4j's Jetty enforces
      # sniHostCheck (the cert SAN must be AdvertisedDNS), so an HTTPS GET /
      # health probe is answered 400 Invalid SNI and the target never goes
      # healthy, so the NLB would never route to it. The node ASGs use
      # HealthCheckType EC2, so this check governs NLB routing only and never
      # replaces an instance. A TCP connect is the
      # strongest check NLB can run here without SNI; the L7 "Neo4j actually
      # serving" assurance is covered by the validate-private conf/TLS audit.
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      # preserve_client_ip.enabled=false prevents NLB NAT-loopback (hairpin)
      # failures when operator tunnels reach the NLB from a cluster member.
      # See "Operator Bastion: NLB Hairpin" in
      # neo4j-ee/docs/topologies/private/architecture.md.
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: "false"
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jBoltTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - 'bolt'
          - 'tg'
      Port: 7687
      Protocol: TLS
      # Bolt is a binary protocol, not HTTP, so no L7 health check exists; a
      # TCP connect is the strongest check NLB can run for this target group.
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: "false"
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Ref 'AWS::StackName'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
      VpcId: !Ref Neo4jVPC

  Neo4jOperatorBastion:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: t4g.small
      SubnetId: !Ref Neo4jPrivateSubnet1
      SecurityGroupIds:
        - !Ref Neo4jBastionSecurityGroup
      IamInstanceProfile: !Ref Neo4jBastionInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

          # The bastion is a port-forward relay only. It installs nothing:
          # operator tools run the driver and cypher-shell locally.
          systemctl is-active amazon-ssm-agent

          /opt/aws/bin/cfn-signal --success true \
            --stack ${AWS::StackName} \
            --resource Neo4jOperatorBastion \
            --region ${AWS::Region}
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: Name
          Value: !Sub '${AWS::StackName}-bastion'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  # Session Manager preferences for interactive shells on the bastion and
  # the nodes. Operators pass this document with --document-name. Session
  # Manager does not log port-forwarding sessions, so the operator tools'
  # tunnels are not recorded here. CloudTrail StartSession events and the
  # Neo4j security and query logs are the trail for those.
  Neo4jSessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/neo4j/${AWS::StackName}/sessions'
      RetentionInDays: 90
      KmsKeyId: !GetAtt Neo4jStackKey.Arn
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  Neo4jSessionPreferences:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Session
      DocumentFormat: YAML
      Content:
        schemaVersion: '1.0'
        description: !Sub 'Interactive shell sessions for stack ${AWS::StackName}, logged to CloudWatch'
        sessionType: Standard_Stream
        inputs:
          cloudWatchLogGroupName: !Ref Neo4jSessionLogGroup
          cloudWatchEncryptionEnabled: true
          cloudWatchStreamingEnabled: true
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"

  # Interface endpoints for every AWS API the nodes call (security review H2).
  # Node SG egress reaches AWS only through them. Each endpoint policy allows
  # any action by a principal in this account. The scope is account-wide on
  # purpose: in-VPC applications such as Hume share these endpoints. The node
  # IAM role, not the endpoint policy, controls what a node may call.

  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcId: !Ref Neo4jVPC
      SubnetIds: !If
        - CreateCluster
        - - !Ref Neo4jPrivateSubnet1
          - !Ref Neo4jPrivateSubnet2
          - !Ref Neo4jPrivateSubnet3
        - - !Ref Neo4jPrivateSubnet1
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  SsmMessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcId: !Ref Neo4jVPC
      SubnetIds: !If
        - CreateCluster
        - - !Ref Neo4jPrivateSubnet1
          - !Ref Neo4jPrivateSubnet2
          - !Ref Neo4jPrivateSubnet3
        - - !Ref Neo4jPrivateSubnet1
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  Ec2MessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcId: !Ref Neo4jVPC
      SubnetIds: !If
        - CreateCluster
        - - !Ref Neo4jPrivateSubnet1
          - !Ref Neo4jPrivateSubnet2
          - !Ref Neo4jPrivateSubnet3
        - - !Ref Neo4jPrivateSubnet1
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  LogsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcId: !Ref Neo4jVPC
      SubnetIds: !If
        - CreateCluster
        - - !Ref Neo4jPrivateSubnet1
          - !Ref Neo4jPrivateSubnet2
          - !Ref Neo4jPrivateSubnet3
        - - !Ref Neo4jPrivateSubnet1
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !Ref Neo4jVPC
      SubnetIds: !If
        - CreateCluster
        - - !Ref Neo4jPrivateSubnet1
