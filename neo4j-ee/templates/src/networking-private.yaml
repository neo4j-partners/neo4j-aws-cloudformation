  # The S3 gateway endpoint policy allows two kinds of request. The first is
  # reads from the AWS-owned buckets that AL2023 package updates and the SSM
  # agent need. The bucket names come from the SSM Agent technical details
  # page (ssm-agent-technical-details.html) and the AWS MGN AL2023 VPC
  # endpoint guidance. The second is any request by a principal in this
  # account to a bucket in this account (security review M9).
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AwsOwnedPackageAndAgentBuckets
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-de612dc2/*'
              - !Sub 'arn:${AWS::Partition}:s3:::amazon-ssm-${AWS::Region}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::aws-ssm-${AWS::Region}/*'
              - !Sub 'arn:${AWS::Partition}:s3:::${AWS::Region}-birdwatcher-prod/*'
              - !Sub 'arn:${AWS::Partition}:s3:::patch-baseline-snapshot-${AWS::Region}/*'
          - Sid: ThisAccountOnly
            Effect: Allow
            Principal: '*'
            Action: '*'
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId
                aws:ResourceAccount: !Ref AWS::AccountId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref Neo4jVPC
      RouteTableIds: !If
        - CreateCluster
        - - !Ref Neo4jPrivateRouteTable1
          - !Ref Neo4jPrivateRouteTable2
          - !Ref Neo4jPrivateRouteTable3
        - - !Ref Neo4jPrivateRouteTable1
