  Neo4jNLBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow external traffic to Neo4j NLB on Browser and Bolt ports
      VpcId: !Ref Neo4jVPC
      # An explicit egress rule replaces the default allow-all rule. An empty
      # list does not, so the loopback placeholder below stands in for "no
      # egress". No real traffic matches it.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: Placeholder that removes the default allow-all egress rule
      SecurityGroupIngress:
        - !If
          - UsePublicTLS
          - IpProtocol: tcp
            FromPort: 7473
            ToPort: 7473
            CidrIp: !Ref AllowedCIDR
          - IpProtocol: tcp
            FromPort: 7474
            ToPort: 7474
            CidrIp: !Ref AllowedCIDR
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          CidrIp: !Ref AllowedCIDR

  Neo4jExternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Neo4j traffic from NLB to instances on Browser and Bolt ports
      VpcId: !Ref Neo4jVPC
      # Public nodes have no VPC endpoints, so AWS APIs and the OIDC issuer
      # are reached over the internet on HTTPS. Egress is HTTPS only, plus the
      # cluster ports to the other nodes. Both node SGs carry it inline,
      # because an SG without an inline egress rule keeps the default
      # allow-all rule and the instance gets the union of its SGs.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS APIs and the OIDC identity provider
      SecurityGroupIngress:
        - !If
          - UsePublicTLS
          - IpProtocol: tcp
            FromPort: 7473
            ToPort: 7473
            SourceSecurityGroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
          - IpProtocol: tcp
            FromPort: 7474
            ToPort: 7474
            SourceSecurityGroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          SourceSecurityGroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId

  Neo4jNLBEgressToBrowser:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: !If [UsePublicTLS, 7473, 7474]
      ToPort: !If [UsePublicTLS, 7473, 7474]
      DestinationSecurityGroupId: !GetAtt Neo4jExternalSecurityGroup.GroupId

  Neo4jNLBEgressToBolt:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jNLBSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7687
      ToPort: 7687
      DestinationSecurityGroupId: !GetAtt Neo4jExternalSecurityGroup.GroupId

  Neo4jInternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable Neo4j Internal Ports
      VpcId: !Ref Neo4jVPC
      # Public nodes have no VPC endpoints, so AWS APIs and the OIDC issuer
      # are reached over the internet on HTTPS. Egress is HTTPS only, plus the
      # cluster ports to the other nodes. Both node SGs carry it inline,
      # because an SG without an inline egress rule keeps the default
      # allow-all rule and the instance gets the union of its SGs.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS APIs and the OIDC identity provider

  Neo4jInternalSGIngress5000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGIngress6000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 6000
      ToPort: 6000
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGIngress7000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7000
      ToPort: 7000
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGIngress7688:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7688
      ToPort: 7688
      SourceSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId

  Neo4jInternalSGEgress5000:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  Neo4jInternalSGEgress6000:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 6000
      ToPort: 6000
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  Neo4jInternalSGEgress7000:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7000
      ToPort: 7000
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      Description: Neo4j cluster traffic to the other nodes

  Neo4jInternalSGEgress7688:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 7688
      ToPort: 7688
      DestinationSecurityGroupId: !GetAtt Neo4jInternalSecurityGroup.GroupId
