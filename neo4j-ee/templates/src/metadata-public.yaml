  ExternalConnectivityDisclosure:
    Description: >-
      Every connection this product makes. The product downloads nothing on
      deployment. All AWS API calls use the stack's own IAM roles and stay in
      the buyer's account and Region. The node security groups allow
      outbound TCP 443 and the cluster ports only. Neo4j sends no graph data
      outside the buyer's account. RuntimeConnections lists the Neo4j usage
      report and the optional identity provider.
    DeployTimeExternalDependencies: []
    AWSServiceEndpoints:
      - Endpoint: http://169.254.169.254
        Note: Link-local address on the instance. It is not an external endpoint.
        Caller: Node UserData in Neo4jLaunchTemplate, through curl
        Purpose: >-
          Reads an IMDSv2 session token, the instance id and the Availability
          Zone. The AWS CLI and the agents get the instance role credentials
          from the same address.
        DataSent: None
      - Endpoint: Regional AWS CloudFormation API
        Caller: cfn-init and cfn-signal in the node UserData
        Actions:
          - cloudformation:DescribeStackResource
          - cloudformation:SignalResource
        Purpose: >-
          Reads the bootstrap and the Neo4j configuration from the
          Neo4jLaunchTemplate metadata, then signals the node's Auto Scaling
          group.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: The boot status and the instance id
      - Endpoint: Regional Amazon EC2 API
        Caller: Node UserData and bootstrap, through the AWS CLI
        Actions:
          - ec2:DescribeTags
          - ec2:DescribeInstances
          - ec2:DescribeVolumes
          - ec2:AttachVolume
        Purpose: >-
          Reads the instance's stack tags, finds the private addresses of the
          cluster members and attaches the node's retained data volume.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: The instance id and the data volume id
      - Endpoint: Regional Amazon EC2 Auto Scaling API
        Caller: Node bootstrap, through the AWS CLI
        Actions:
          - autoscaling:DescribeAutoScalingGroups
        Purpose: Lists the stack's node groups to find the cluster members.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: None
      - Endpoint: Regional AWS Secrets Manager API
        Caller: Node UserData and bootstrap, through the AWS CLI
        Actions:
          - secretsmanager:GetSecretValue
        Purpose: >-
          Reads the Neo4j admin and application passwords, and any Bloom or
          GDS license secret. Secrets Manager decrypts them with the stack's
          AWS KMS key.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: None
      - Endpoint: Regional Amazon CloudWatch Logs API
        Caller: The Amazon CloudWatch agent on each node
        Purpose: Sends the logs to /neo4j/<StackName>/application.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: >-
          The Neo4j debug and security logs and the cloud-init output log,
          to CloudWatch Logs in the buyer's account
      - Endpoint: Regional AWS Systems Manager APIs, including ssmmessages and ec2messages
        Caller: The AWS Systems Manager agent on each node
        Purpose: Provides Session Manager access.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: Session Manager session data
      - Endpoint: Amazon Linux 2023 package repository in the stack's Region, on Amazon S3
        Caller: The dnf metadata timer of Amazon Linux 2023
        Purpose: Checks every 12 to 24 hours whether updates exist. It installs nothing.
        Route: The internet gateway, over HTTPS on port 443
        DataSent: None
    RuntimeConnections:
      - Endpoint: The other Neo4j nodes of the stack, on TCP 5000, 6000, 7000 and 7688
        Caller: Neo4j
        Purpose: Cluster discovery, Raft replication and server-side routing.
        Route: The stack's VPC
      - Endpoint: Amazon Time Sync Service at the link-local address 169.254.169.123
        Caller: chrony on each node
        Purpose: Keeps the clock in sync.
      - Endpoint: udc.neo4j.com, over HTTPS
        Caller: Neo4j
        Purpose: >-
          Sends the Neo4j usage report. It carries no graph data.
        Route: The internet gateway
      - Endpoint: The OpenID Connect provider set in OidcIssuerUri, over HTTPS
        Caller: Neo4j
        Purpose: Fetches the provider's discovery document and signing keys.
        Route: The internet gateway
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "AWS Marketplace Parameters"
        Parameters:
          - ImageId
      - Label:
          default: "Neo4j Configuration"
        Parameters:
          - Password
          - NumberOfServers
          - InstanceType
          - DataDiskSize
          - DataVolumeKmsKeyId
          - Node1SnapshotId
      - Label:
          default: "Plugin licensing (Bloom, GDS)"
        Parameters:
          - InstallBloom
          - BloomLicenseSecretArn
          - InstallGDS
          - GdsLicenseSecretArn
      - Label:
          default: "Network"
        Parameters:
          - NlbDeletionProtection
      - Label:
          default: "Optional Public TLS"
        Parameters:
          - EnableTLS
          - CertificateArn
          - AdvertisedDNS
      - Label:
          default: "Security & Monitoring"
        Parameters:
          - AllowedCIDR
          - AlertEmail
      - Label:
          default: "Single sign-on (OIDC)"
        Parameters:
          - OidcIssuerUri
          - OidcClientId
          - OidcBrowserClientId
          - OidcPrincipalClaim
          - OidcGroupsClaim
          - OidcAdminGroup
          - OidcReaderGroup
          - OidcGroupRoleMapping
    ParameterLabels:
      ImageId:
        default: Image ID
      Password:
        default: Password
      NumberOfServers:
        default: Number of Servers
      InstanceType:
        default: Instance Type
      DataDiskSize:
        default: Data Disk Size (GB)
      DataVolumeKmsKeyId:
        default: Data Volume KMS Key ID
      InstallBloom:
        default: Install Bloom Plugin
      BloomLicenseSecretArn:
        default: Bloom License Secret ARN
      InstallGDS:
        default: Install Graph Data Science Plugin
      GdsLicenseSecretArn:
        default: GDS License Secret ARN
      AlertEmail:
        default: Alert Email Address
      AllowedCIDR:
        default: Allowed CIDR
      EnableTLS:
        default: Enable TLS
      CertificateArn:
        default: ACM Certificate ARN
      AdvertisedDNS:
        default: Advertised DNS Name
      OidcIssuerUri:
        default: OIDC Issuer URI
      OidcClientId:
        default: OIDC Client ID (Audience)
      OidcBrowserClientId:
        default: OIDC Browser Client ID
      OidcPrincipalClaim:
        default: OIDC Username Claim
      OidcGroupsClaim:
        default: OIDC Groups Claim
      OidcAdminGroup:
        default: OIDC Admin Group
      OidcReaderGroup:
        default: OIDC Reader Group
      OidcGroupRoleMapping:
        default: OIDC Group Role Mapping
      Node1SnapshotId:
        default: Node 1 Snapshot ID
      NlbDeletionProtection:
        default: NLB Deletion Protection
