      MaxSize: 1
      DesiredCapacity: 1
      HealthCheckType: ELB
      HealthCheckGracePeriod: 1200
      VPCZoneIdentifier:
        - !Ref Neo4jSubnet1
      TargetGroupARNs:
        - Ref: Neo4jBrowserTargetGroup
        - Ref: Neo4jBoltTargetGroup
      Tags:
        - Key: StackID
          Value: !Ref 'AWS::StackId'
          PropagateAtLaunch: true
        - Key: Name
          Value: !Sub '${AWS::StackName}-node-1'
          PropagateAtLaunch: true
        - Key: Role
          Value: neo4j-cluster-node
          PropagateAtLaunch: true
        - Key: NodeIndex
          Value: "1"
          PropagateAtLaunch: true
        - Key: "aws-apn-id"
          Value: "pc:4t4a9h39qkq4tbo3n9zd51p25"
